services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: rokcy_qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=$TZ
      - WEBUI_PORT=$PORT
      - TORRENTING_PORT=6881
    volumes:
      - $CONFIG:/config
      - $DATA:/data
    ports:
      - $PORT:8080
      - 6881:6881
      - 6881:6881/udp
    stop_grace_period: "10s" #optional
    restart: unless-stopped
